name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Verify GitHub Secrets without exposing values
      - name: Check environment configuration
        run: |
          node -e "for (const k of ['BASE_URL','APP_USER_NAME','APP_PASSWORD','API_URL','TOKEN']) console.log(k + ': ' + (process.env[k] ? 'SET' : 'MISSING'))"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USER_NAME: ${{ secrets.APP_USER_NAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          TOKEN: ${{ secrets.TOKEN }}

      # Execute Playwright tests
      - name: Run Playwright tests
        id: playwright_tests
        run: npx playwright test --config=playwright.config.ts --reporter=html,json,allure-playwright
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USER_NAME: ${{ secrets.APP_USER_NAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          TOKEN: ${{ secrets.TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_JSON_REPORT: playwright-report/results.json

      # Parse Playwright JSON results
      - name: Parse Test Results
        if: always()
        id: parse_results
        run: |
          if [ -f playwright-report/results.json ]; then
            PASSED=$(node -p "require('./playwright-report/results.json').stats.expected || 0")
            FAILED=$(node -p "require('./playwright-report/results.json').stats.unexpected || 0")
            SKIPPED=$(node -p "require('./playwright-report/results.json').stats.skipped || 0")
          else
            PASSED=0
            FAILED=0
            SKIPPED=0
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          echo "Test Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Skipped: $SKIPPED"

      # Upload reports as GitHub Actions artifacts
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: ignore
          retention-days: 90

      # Create run-specific reports and latest root landing page
      - name: Create GitHub Pages directory structure
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_DIR="github-pages/runs/${RUN_ID}"

          mkdir -p "${RUN_DIR}/playwright"
          mkdir -p "${RUN_DIR}/allure"

          # Copy Playwright HTML report
          if [ -d "playwright-report" ]; then
            cp -r playwright-report/. "${RUN_DIR}/playwright/"
          fi

          # Run-specific dashboard
          cat > "${RUN_DIR}/index.html" <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Reports - Run ${RUN_ID}</title>
          </head>
          <body>
            <h1>Playwright Reports - Run ${RUN_ID}</h1>
            <p><a href="playwright/">Playwright HTML Report</a></p>
            <p><a href="allure/">Allure Report</a></p>
          </body>
          </html>
          EOF

          # Root landing page points to latest run
          cat > github-pages/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Automation Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
                line-height: 1.6;
              }
              a {
                color: #0969da;
              }
            </style>
          </head>
          <body>
            <h1>Playwright Automation Reports</h1>
            <h2>Latest execution: ${RUN_ID}</h2>
            <p>
              <a href="runs/${RUN_ID}/playwright/">
                View Playwright HTML Report
              </a>
            </p>
            <p>
              <a href="runs/${RUN_ID}/allure/">
                View Allure Report
              </a>
            </p>
            <p>
              <a href="runs/${RUN_ID}/">
                View Run Dashboard
              </a>
            </p>
          </body>
          </html>
          EOF

      # Install Allure CLI
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      # Generate Allure report inside the current run folder
      - name: Generate Allure Report
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          ALLURE_DIR="github-pages/runs/${RUN_ID}/allure"

          mkdir -p "$ALLURE_DIR"

          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results -o "$ALLURE_DIR" --clean
          else
            echo "No Allure results found."

            cat > "$ALLURE_DIR/index.html" <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Allure Report</title>
          </head>
          <body>
            <h1>Allure Report</h1>
            <p>No Allure results available for this run.</p>
          </body>
          </html>
          EOF
          fi

      # Deploy latest root page and preserve historical run folders
      - name: Deploy reports to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github-pages
          publish_branch: gh-pages
          keep_files: true

      # Print report URLs
      - name: Print report URLs
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Latest Reports Dashboard:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/"

          echo "Run Dashboard:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/runs/${RUN_ID}/"

          echo "Playwright Report:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/runs/${RUN_ID}/playwright/"

          echo "Allure Report:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/runs/${RUN_ID}/allure/"
