name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Verify that GitHub Secrets are available without printing values
      - name: Check environment configuration
        run: |
          node -e "for (const k of ['BASE_URL','APP_USER_NAME','APP_PASSWORD','API_URL','TOKEN']) console.log(k + ': ' + (process.env[k] ? 'SET' : 'MISSING'))"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USER_NAME: ${{ secrets.APP_USER_NAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          TOKEN: ${{ secrets.TOKEN }}

      - name: Run Playwright tests
        id: playwright_tests
        run: npx playwright test --config=playwright.config.ts --reporter=html,json,allure-playwright
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USER_NAME: ${{ secrets.APP_USER_NAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          TOKEN: ${{ secrets.TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PLAYWRIGHT_JSON_REPORT: playwright-report/results.json

      - name: Parse Test Results
        if: always()
        id: parse_results
        run: |
          if [ -f playwright-report/results.json ]; then
            PASSED=$(node -p "require('./playwright-report/results.json').stats.expected || 0")
            FAILED=$(node -p "require('./playwright-report/results.json').stats.unexpected || 0")
            SKIPPED=$(node -p "require('./playwright-report/results.json').stats.skipped || 0")
          else
            PASSED=0
            FAILED=0
            SKIPPED=0
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          echo "Test Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Skipped: $SKIPPED"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: ignore
          retention-days: 90

      # Prepare report directories
      - name: Create GitHub Pages directory structure
        if: always()
        run: |
          mkdir -p github-pages/playwright
          mkdir -p github-pages/allure

          if [ -d "playwright-report" ]; then
            cp -r playwright-report/* github-pages/playwright/ 2>/dev/null || true
          fi

          cat > github-pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Test Reports - Run ${{ github.run_id }}</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              .report-link {
                display: inline-block;
                margin: 10px;
                padding: 15px;
                background: #007bff;
                color: white;
                text-decoration: none;
                border-radius: 5px;
              }
            </style>
          </head>
          <body>
            <h1>Test Reports for Run #${{ github.run_id }}</h1>
            <a href="playwright/" class="report-link">Playwright Report</a>
            <a href="allure/" class="report-link">Allure Report</a>
          </body>
          </html>
          EOF

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results -o github-pages/allure --clean
          else
            echo "No Allure results found."
            mkdir -p github-pages/allure
            cat > github-pages/allure/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Allure Report</title></head>
          <body>
            <h1>Allure Report</h1>
            <p>No Allure results available for this run.</p>
          </body>
          </html>
          EOF
          fi

      # Deploy reports to GitHub Pages
      - name: Deploy reports to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github-pages
          publish_branch: gh-pages
          destination_dir: runs/${{ github.run_id }}

      - name: Print report URLs
        if: always()
        run: |
          echo "Run Dashboard:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/runs/${{ github.run_id }}/"
          echo "Playwright Report:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/runs/${{ github.run_id }}/playwright/"
          echo "Allure Report:"
          echo "https://rangarajan1989.github.io/Playwright-POM-Framework/runs/${{ github.run_id }}/allure/"
