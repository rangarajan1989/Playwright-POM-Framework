name: Master CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Run up to environment"
        required: true
        default: "QA"
        type: choice
        options:
          - dev
          - QA
          - stage
          - Prod

jobs:
  build:
    name: Build & Verify Framework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc --noEmit

  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        run: echo "Deployed to DEV"

  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Playwright browsers
        id: pw-cache-dev
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-dev.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chrome

      - name: Install Playwright OS deps only
        if: steps.pw-cache-dev.outputs.cache-hit == 'true'
        run: npx playwright install-deps chrome

      - name: Run Sanity Tests on DEV
        run: npx playwright test --project=chrome --grep "@smoke"
        env:
          ENV: dev
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Upload DEV HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-html-report
          path: reports/html-report/
          retention-days: 30

  deploy-qa:
    name: Deploy to QA
    needs: sanity-dev
    if: contains(fromJSON('["QA","stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to QA
        run: echo "Deployed to QA"

  regression-qa:
    name: QA - Regression Tests
    needs: deploy-qa
    if: contains(fromJSON('["QA","stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    environment: QA
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Playwright browsers
        id: pw-cache-qa
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-qa.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chrome

      - name: Install Playwright OS deps only
        if: steps.pw-cache-qa.outputs.cache-hit == 'true'
        run: npx playwright install-deps chrome

      - name: Run Regression Tests on QA
        run: npx playwright test --project=chrome --grep "@regression"
        env:
          ENV: qa
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Upload QA HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-html-report
          path: reports/html-report/
          retention-days: 30

  deploy-stage:
    name: Deploy to STAGE
    needs: regression-qa
    if: contains(fromJSON('["stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to STAGE
        run: echo "Deployed to STAGE"

  sanity-stage:
    name: STAGE - Sanity Tests
    needs: deploy-stage
    if: contains(fromJSON('["stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Playwright browsers
        id: pw-cache-stage
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-stage.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chrome

      - name: Install Playwright OS deps only
        if: steps.pw-cache-stage.outputs.cache-hit == 'true'
        run: npx playwright install-deps chrome

      - name: Run Sanity Tests on STAGE
        run: npx playwright test --project=chrome --grep "@smoke"
        env:
          ENV: stage
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Upload STAGE HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-html-report
          path: reports/html-report/
          retention-days: 30

  deploy-prod:
    name: Deploy to PROD
    needs: sanity-stage
    if: github.event.inputs.environment == 'Prod'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Deploy to PROD
        run: echo "Deployed to PROD"

  smoke-prod:
    name: PROD - Smoke Tests
    needs: deploy-prod
    if: github.event.inputs.environment == 'Prod'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Playwright browsers
        id: pw-cache-prod
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-prod.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chrome

      - name: Install Playwright OS deps only
        if: steps.pw-cache-prod.outputs.cache-hit == 'true'
        run: npx playwright install-deps chrome

      - name: Run Smoke Tests on PROD
        run: npx playwright test --project=chrome --grep "@smoke"
        env:
          ENV: prod
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Upload PROD HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-html-report
          path: reports/html-report/
          retention-days: 30

  summary:
    name: Pipeline Summary
    needs: [build, sanity-dev, regression-qa, sanity-stage, smoke-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "Selected env:  ${{ github.event.inputs.environment }}"
          echo "Build:         ${{ needs.build.result }}"
          echo "DEV Sanity:    ${{ needs.sanity-dev.result }}"
          echo "QA Regression: ${{ needs.regression-qa.result }}"
          echo "STAGE Sanity:  ${{ needs.sanity-stage.result }}"
          echo "PROD Smoke:    ${{ needs.smoke-prod.result }}"
